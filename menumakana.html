<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Menu Makanan</title>
  <style>
      body {
          margin: 0; /* Menghilangkan celah putih bawaan browser di pinggir layar */
      }

      #judul-utama {
          text-align: center;         /* Teks di tengah */
          background-color: #ffa654;  /* Warna kotak di belakang */

</head>
